server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true # Allows Gateway to discover services via Eureka
      routes:
        # ==========================================
        # 1. Auth Service Route with Rate Limiting
        # ==========================================
        - id: auth-service-route
          uri: lb://AUTH-SERVICE         # Load Balancer -> Queries Eureka for 'AUTH-SERVICE'
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10 # 10 tokens added per second
                redis-rate-limiter.burstCapacity: 20 # Maximum burst capacity of 20 requests
                redis-rate-limiter.requestedTokens: 1 # Each request consumes 1 token
                key-resolver: "#{@ipKeyResolver}" # References your RateLimiterConfig Bean

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG