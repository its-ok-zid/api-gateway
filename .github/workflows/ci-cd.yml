name: Microservice CI/CD Pipeline

on:
  push:
    branches:
      - '**'

jobs:
  # ==========================================
  # STAGE 1: TEST (Quality Gate)
  # ==========================================
  test:
    name: 1. Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          # Tells Maven to look for these variables for the 'GitHub' server
          server-id: 'github'
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Run Tests
        env:
          # Injects your GitHub username and your new PAT securely
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.PACKAGES_PAT }}
        run: ./mvnw clean verify

  # ==========================================
  # STAGE 2: BUILD (Compile JAR)
  # ==========================================
  build:
    name: 2. Build JAR
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: 'github'
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Compile and Package
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.PACKAGES_PAT }}
        run: ./mvnw clean package -DskipTests

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1
  # ==========================================
  # STAGE 3: PACKAGE
  # ==========================================
  package:
    name: 3. Docker Package & Push
    needs: build
    runs-on: ubuntu-latest

    # 1. Map the step output to a global job-level output
    outputs:
      docker_tag: ${{ steps.meta.outputs.TAG }}

    steps:
      - uses: actions/checkout@v4
      # ... (keep download artifact & docker login steps exactly the same) ...

      - name: Determine Environment and Docker Tag
        id: meta
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            # 2. Write to BOTH Env (for Job 3) AND Output (for Job 4)
            echo "TAG=latest" >> $GITHUB_ENV
            echo "TAG=latest" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            echo "TAG=develop" >> $GITHUB_ENV
            echo "TAG=develop" >> $GITHUB_OUTPUT
          else
            CLEAN_BRANCH=$(echo "${{ github.ref_name }}" | tr '/' '-')
            echo "TAG=sandbox-${CLEAN_BRANCH}" >> $GITHUB_ENV
            echo "TAG=sandbox-${CLEAN_BRANCH}" >> $GITHUB_OUTPUT
          fi

      - name: Build & Push Docker Image
        # env.TAG still works perfectly here!
        run: |
          IMAGE_NAME="${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:${{ env.TAG }}"
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME

  # ==========================================
  # STAGE 4: DEPLOY
  # ==========================================
  deploy:
    name: 4. Deploy to Server
    needs: package
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'Production' || (github.ref_name == 'develop' && 'Development' || 'Sandbox') }}
    steps:
      - name: Execute Target Deployment
        run: |
          echo "Initiating deployment for Branch: ${{ github.ref_name }}"
          echo "Target Environment: ${{ github.ref_name == 'main' && 'Production' || (github.ref_name == 'develop' && 'Development' || 'Sandbox') }}"
          
          # 3. Retrieve the output from the previous job using the 'needs' context
          echo "Deploying Docker Tag: ${{ needs.package.outputs.docker_tag }}"