name: Microservice CI/CD Pipeline

on:
  push:
    branches:
      - '**' 

jobs:
  test:
    name: 1. Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run Tests
        run: ./mvnw clean verify

  build:
    name: 2. Build JAR
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile and Package
        run: ./mvnw clean package -DskipTests
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1

  package:
    name: 3. Docker Package & Push
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Determine Environment and Docker Tag
        id: meta
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "TAG=latest" >> $GITHUB_ENV
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            echo "TAG=develop" >> $GITHUB_ENV
          else
            CLEAN_BRANCH=$(echo "${{ github.ref_name }}" | tr '/' '-')
            echo "TAG=sandbox-${CLEAN_BRANCH}" >> $GITHUB_ENV
          fi
      - name: Build & Push Docker Image
        run: |
          IMAGE_NAME="${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:${{ env.TAG }}"
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME

  deploy:
    name: 4. Deploy to Server
    needs: package
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'Production' || (github.ref_name == 'develop' && 'Development' || 'Sandbox') }}
    steps:
      - name: Execute Target Deployment
        run: |
          echo "Initiating deployment for Branch: ${{ github.ref_name }}"
          echo "Target Environment: ${{ github.ref_name == 'main' && 'Production' || (github.ref_name == 'develop' && 'Development' || 'Sandbox') }}"
          echo "Deploying Docker Tag: ${{ env.TAG }}"